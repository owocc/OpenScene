<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <title>Local Test App Preview</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: #0f172a;
        background: #f8fafc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background: linear-gradient(145deg, #f8fafc 0%, #eef2ff 100%);
      }

      #app {
        min-height: 100vh;
        padding: 28px;
      }

      .preview-shell {
        width: min(100%, 860px);
        min-height: calc(100vh - 56px);
        margin: 0 auto;
        padding: 30px;
        border: 1px solid #dbe4f0;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 24px 70px rgba(30, 41, 59, 0.12);
      }

      .preview-kicker {
        margin: 0 0 24px;
        color: #64748b;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .preview-canvas {
        display: grid;
        gap: 16px;
        min-height: 280px;
        align-content: start;
        padding: 26px;
        border: 1px dashed #c7d2fe;
        border-radius: 18px;
        background: rgba(238, 242, 255, 0.6);
      }

      .preview-node {
        position: relative;
        min-width: 0;
        border: 1px solid transparent;
        border-radius: 12px;
        transition:
          border-color 120ms ease,
          box-shadow 120ms ease;
      }

      .preview-node:hover {
        border-color: #a5b4fc;
      }

      .preview-node.is-selected {
        border-color: #f59e0b;
        box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.18);
      }

      .preview-text {
        margin: 0;
        padding: 8px 10px;
        line-height: 1.35;
      }

      .preview-card {
        display: grid;
        gap: 14px;
        padding: 24px;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        background: #ffffff;
        box-shadow: 0 8px 24px rgba(30, 41, 59, 0.06);
      }

      .preview-button {
        width: fit-content;
        padding: 10px 16px;
        border: 1px solid #4f46e5;
        border-radius: 10px;
        color: #ffffff;
        background: #4f46e5;
        font: inherit;
        cursor: pointer;
      }

      .preview-button.outline {
        color: #4338ca;
        background: transparent;
      }

      .preview-button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      .preview-input {
        width: min(100%, 360px);
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        color: inherit;
        background: #ffffff;
        font: inherit;
      }

      .empty-state {
        display: grid;
        min-height: 220px;
        place-items: center;
        border: 1px dashed #cbd5e1;
        border-radius: 16px;
        color: #64748b;
        font-size: 14px;
        text-align: center;
      }

      .empty-state strong {
        display: block;
        margin-bottom: 6px;
        color: #334155;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      (() => {
        const PROTOCOL = "cms-preview";
        const VERSION = 2;
        const resourceId =
          new URLSearchParams(window.location.search).get("resourceId") || "local-page";
        let instanceId = makeId();
        let port = null;
        let currentDocument = null;
        let currentLocale = "en-US";
        let interactionMode = "select";
        let selectedId = null;

        function makeId() {
          return window.crypto && typeof window.crypto.randomUUID === "function"
            ? window.crypto.randomUUID()
            : `local-preview-${Date.now()}`;
        }

        function envelope(type, payload) {
          return { protocol: PROTOCOL, version: VERSION, instanceId, type, payload };
        }

        function isEnvelope(value) {
          return (
            value &&
            value.protocol === PROTOCOL &&
            value.version === VERSION &&
            typeof value.instanceId === "string" &&
            typeof value.type === "string"
          );
        }

        function isRecord(value) {
          return value && typeof value === "object" && !Array.isArray(value);
        }

        function resolveValue(value) {
          if (!isRecord(value)) return value;
          if (typeof value.$t === "string") {
            const key = value.$t.replace(/^\/i18n\/\$lang\//, "");
            const dictionaries = currentDocument?.spec?.state?.i18n;
            const dictionary = dictionaries?.[currentLocale] || dictionaries?.["en-US"];
            return dictionary?.[key] ?? value.$t;
          }
          if (typeof value.$state === "string" || typeof value.$bindState === "string") {
            const path = value.$state || value.$bindState;
            let result = currentDocument?.spec?.state;
            for (const part of path.split("/").filter(Boolean)) result = result?.[part];
            return result ?? path;
          }
          if (typeof value.$template === "string") {
            return value.$template.replace(/\{\{\s*([^}]+?)\s*\}\}/g, (_match, path) => {
              const parts = path.split("/").filter(Boolean);
              let result = currentDocument?.spec?.state;
              for (const part of parts) result = result?.[part];
              return result == null ? "" : String(result);
            });
          }
          return value;
        }

        function stringValue(value, fallback = "") {
          const resolved = resolveValue(value);
          return resolved == null ? fallback : String(resolved);
        }

        function childrenOf(element) {
          return [
            ...(Array.isArray(element?.children) ? element.children : []),
            ...(isRecord(element?.slots)
              ? Object.values(element.slots).flatMap((children) =>
                  Array.isArray(children) ? children : [],
                )
              : []),
          ];
        }

        function emitSelection(id, element) {
          if (interactionMode !== "select" || !port) return;
          selectedId = id;
          port.postMessage({ type: "NODE_CLICK", elementId: id, elementType: element.type });
          render();
        }

        function renderElement(id, elements) {
          const element = elements[id];
          if (!element) return null;
          const props = element.props || {};
          const type = element.type || "Unknown";
          const lowerType = type.toLowerCase();
          let node;

          if (lowerType === "text") {
            node = document.createElement("p");
            node.className = "preview-text";
            node.textContent = stringValue(props.text, element.name || "Text");
            node.style.color = stringValue(props.color, "#0f172a");
            node.style.fontSize = `${Number(resolveValue(props.fontSize) || 24)}px`;
          } else if (lowerType === "button") {
            node = document.createElement("button");
            node.className = `preview-button ${stringValue(props.variant) === "outline" ? "outline" : ""}`;
            node.type = "button";
            node.textContent = stringValue(props.label, element.name || "Button");
            node.disabled = Boolean(resolveValue(props.disabled));
          } else if (lowerType === "input") {
            node = document.createElement("input");
            node.className = "preview-input";
            node.value = stringValue(props.value);
            node.placeholder = stringValue(props.placeholder, "Type here");
          } else if (lowerType === "card") {
            node = document.createElement("section");
            node.className = "preview-card";
            node.style.padding = `${Number(resolveValue(props.padding) || 24)}px`;
          } else {
            node = document.createElement("div");
          }

          node.classList.add("preview-node");
          if (selectedId === id) node.classList.add("is-selected");
          node.dataset.nodeId = id;
          node.dataset.nodeType = type;
          node.title = `${type} · ${id}`;
          node.addEventListener("click", (event) => {
            if (interactionMode !== "select") return;
            event.preventDefault();
            event.stopPropagation();
            emitSelection(id, element);
          });

          if (lowerType === "stack") {
            node.style.display = "flex";
            node.style.flexDirection =
              stringValue(props.direction) === "horizontal" ? "row" : "column";
            node.style.gap = `${Number(resolveValue(props.gap) || 16)}px`;
          }

          for (const childId of childrenOf(element)) {
            const child = renderElement(childId, elements);
            if (child) node.append(child);
          }
          return node;
        }

        function render() {
          const app = document.getElementById("app");
          if (!app) return;
          app.replaceChildren();
          const shell = document.createElement("main");
          shell.className = "preview-shell";
          const kicker = document.createElement("p");
          kicker.className = "preview-kicker";
          kicker.textContent = `Local Test App · ${currentLocale}`;
          shell.append(kicker);
          const canvas = document.createElement("section");
          canvas.className = "preview-canvas";
          const root = currentDocument?.spec?.root;
          const elements = currentDocument?.spec?.elements || {};
          if (root && elements[root]) {
            canvas.append(renderElement(root, elements));
          } else {
            const empty = document.createElement("div");
            empty.className = "empty-state";
            empty.innerHTML =
              "<div><strong>Empty AppDocument</strong>Add the first App node from Studio.</div>";
            canvas.append(empty);
          }
          shell.append(canvas);
          app.append(shell);
        }

        function handlePortMessage(event) {
          const message = event.data;
          if (!message || typeof message.type !== "string") return;
          if (message.type === "SPEC_REPLACE") {
            currentDocument = message.document;
            render();
          } else if (message.type === "SET_LOCALE") {
            currentLocale = typeof message.locale === "string" ? message.locale : currentLocale;
            render();
          } else if (message.type === "SET_INTERACTION_MODE") {
            interactionMode = message.mode === "select" ? "select" : "preview";
          } else if (message.type === "SELECT_NODE") {
            selectedId = typeof message.elementId === "string" ? message.elementId : null;
            render();
          }
        }

        window.addEventListener("message", (event) => {
          if (event.source !== window.parent || event.origin !== window.location.origin) return;
          if (!isEnvelope(event.data)) return;
          if (event.data.type !== "BRIDGE_INIT") return;
          const payload = event.data.payload || {};
          instanceId = event.data.instanceId;
          currentDocument = payload.document || null;
          currentLocale = payload.context?.locale || "en-US";
          interactionMode = payload.interactionMode === "select" ? "select" : "preview";
          port = event.ports[0] || null;
          if (port) {
            port.onmessage = handlePortMessage;
            port.start();
          }
          render();
        });

        render();
        window.parent.postMessage(
          envelope("BRIDGE_READY", {
            capabilities: ["error-reporting", "node-selection", "spec-replace", "state-sync"],
            identity: { id: resourceId, type: "page" },
          }),
          window.location.origin,
        );
      })();
    </script>
  </body>
</html>
